
// Top-level build file where you can add configuration options ui to all sub-projects/modules.

buildscript {
    ext {

        agp_version1 = '4.0.2'
        agp_version = '7.3.1'
    }

    // ext.kotlin_version = '1.1.51'
    ext.kotlin_version = '2.0.21'

    repositories {
        google()
//        jcenter()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
        maven {
            url "https://maven.google.com"
        }

        maven { url 'https://maven.aliyun.com/repository/jcenter'}
        maven { url "https://artifactory.img.ly/artifactory/imgly" }
       /* maven {
            name = "nexus"
            url = uri("https://nexus.banuba.net/repository/maven-releases")
        }*/

        // ✅ Required
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
//        classpath 'com.android.tools.build:gradle:8.4.0' // Example, use the latest stable version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.14'
        classpath 'com.jakewharton:butterknife-gradle-plugin:10.2.3'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
//        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.8.5'
        classpath 'gradle.plugin.com.onesignal:onesignal-gradle-plugin:0.14.0'
        /*classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.4.10'*/
        /*classpath 'org.jetbrains.kotlin:kotlin-android-extensions:1.1.51'*/




        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

