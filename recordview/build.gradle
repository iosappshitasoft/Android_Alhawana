apply plugin: 'com.android.library'
// Make sure the maven-publish plugin is applied at the top
apply plugin: 'maven-publish'

android {
    namespace 'com.devlomi.record_view'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // ✅ START: ADD THIS BLOCK
    // This block tells the Android Gradle Plugin to create publications
    // for all variants, which makes them available to the `maven-publish` plugin.
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    // ✅ END: ADD THIS BLOCK
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'io.supercharge:shimmerlayout:2.1.0'
    testImplementation 'junit:junit:4.12'
}

// This block can now correctly find the 'release' component created above.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.devlomi.record-view'
                artifactId = 'record-view'
                version = '3.1.3'
            }
        }
    }
}

