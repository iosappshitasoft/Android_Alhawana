buildscript {
  repositories {
    jcenter()
    mavenCentral()
  }
  dependencies {
    classpath 'com.github.dcendents:android-maven-gradle-plugin:1.4.1'
  }
}
plugins {
//  id "com.jfrog.bintray" version "1.7"
}

apply plugin: 'com.android.library'
//apply plugin: 'com.github.dcendents.android-maven'

def libVersionCode = '2.0.3'
def siteUrl = 'https://github.com/dlazaro66/QRCodeReaderView/tree/master/QRCodeReaderView-lib'
def gitUrl = 'https://github.com/dlazaro66/QRCodeReaderView/tree/master/QRCodeReaderView-lib.git'

group = "com.dlazaro66.qrcodereaderview"
version = libVersionCode

android {
  namespace 'com.QRCodeReaderView'
  lintOptions {
    abortOnError false
  }

  compileSdkVersion 26

  defaultConfig {
    minSdkVersion 14
    targetSdkVersion 26
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
    }
  }
}

dependencies {
  api 'com.google.zxing:core:3.2.1'
  implementation 'junit:junit:4.12'
  implementation 'org.mockito:mockito-core:2.7.5'
  //implementation "org.robolectric:robolectric:4.3"

  testImplementation ("org.robolectric:robolectric:4.3"){
    exclude group: 'org.apache.maven', module: 'maven-artifact'
    exclude group: 'org.apache.maven', module: 'maven-artifact-manager'
    exclude group: 'org.apache.maven', module: 'maven-model'
    exclude group: 'org.apache.maven', module: 'maven-plugin-registry'
    exclude group: 'org.apache.maven', module: 'maven-profile'
    exclude group: 'org.apache.maven', module: 'maven-project'
    exclude group: 'org.apache.maven', module: 'maven-settings'
    exclude group: 'org.apache.maven', module: 'maven-error-diagnostics'
    exclude group: "org.apache.maven.wagon"
  }
}

